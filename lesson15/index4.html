<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <p>hiển thị giá trị khi so sánh giữa x và y</p>
    <p id="demo1"></p>
    <p id="demo2"></p>

    <script>
        let x = false;
        let y = new Boolean(false);

        document.getElementById("demo").innerHTML = typeof x +"và" + typeof y;
        document.getElementById("demo").innerHTML = (x==y);//true
        document.getElementById("demo").innerHTML = (x===y);//false
    </script>
</body>
</html>
