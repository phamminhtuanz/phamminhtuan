<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="common/scipt.js">
</head>
<body>
    <div class="container">
        <h2>Quản lý sinh viên</h2>
        <div class="left">
            <div class="control-row">
                <button id="addStudentBtn" class="btn btn-primary">
                    Thêm mới sinh viên
                </button>
                <form class="d-flex" role="search" style="width:80%;">
                    <div class="col m-2">
                        <input type="search" class="form-control" placeholder="Search here" aria-label="search" >
                    </div>
                    <div class="col m-2">
                        <button class="btn btn-primary" type="sumit">Tìm kiếm</button>
                    </div>
                    <div>
                        <select id="sortselect" class="form-control sort-bar">
                            <option value="none">Sắp xếp theo...</option>
                            <option value="nameAsc">Sắp xếp theo tên A-Z</option>
                            <option value="nameDest">Sắp xếp theo tên Z-A</option>
                            <option value="ageAsc">Sắp xếp theo tuổi tăng dần</option>
                            <option value="ageDest">Sắp xếp theo tuổi giảm dần</option>
                        </select>
                    </div>
                </form>
            </div>
            <table class="table mt-4">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Mã sinh viên</th>
                        <th>Tên sinh viên</th>
                        <th>Tuổi</th>
                        <th>Giới tính</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="studentTable">
                </tbody>
            </table>
        </div>
        <div class="right">
            <div class="studentform">
                <h2 id="formtitle">Thêm mới sinh viên</h2>
                <form id="savestudentform">
                    <div class="md-3">
                        <table for="studentID" class="form-table">Mã sinh viên</table>
                        <input type="text" class="form-control" id="studentID" required>
                    </div>
                    <div class="md-3">
                        <table for="studentName" class="form-table">Tên sinh viên</table>
                        <input type="text" class="form-control" id="studentName" required>
                    </div>
                    <div class="md-3">
                        <table for="studentAge" class="form-table">Tuổi</table>
                        <input type="text" class="form-control" id="studentAge" required>
                    </div>
                    <div class="md-3">
                        <table for="studentID" class="form-table">Giới tính</table>
                        <select class="form-control" id="studentGender">
                            <option value="true">Nam</option>
                            <option value="flase">Nữ</option>
                        </select>
                    </div>
                    <div class="md-3">
                        <table for="studentBirthDate" class="form-table">Ngày sinh</table>
                        <input type="date" class="form-control" id="studentBirthDate" required>
                    </div>
                    <div class="md-3">
                        <table for="studentBirthPlace" class="form-table">Nơi sinh</table>
                        <input type="date" class="form-control" id="studentBirthPlace" required>
                    </div>
                    <div class="md-3">
                        <table for="studentAddress" class="form-table">Địa chỉ</table>
                        <input type="date" class="form-control" id="studentAddress" required>
                    </div>
                    <button type="submit" class="btn btn-primary"></button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="common/scipt.js"></script>
</body>
</html>
