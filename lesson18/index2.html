<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h2>Đây là thẻ h2</h2>
    <p>Đây là thẻ p</p>
    <p>sadboy</p>

    <p>List1</p>
    <ul>
        <li>Xoài</li>
        <li>Cam</li>
        <li>Chuối</li>
    </ul>

    <p>List2</p>
    <ul>
        <li>Meo</li>
        <li>Meoo</li>
        <li>Meooo</li>
    </ul>
    <p><a href="http://facebook.com">phamminhtuan</a></p>
    <p class="intro">P có class là intro</p>
    <input type="text" placeholder="xóa phông được nhé">
    <input type="number" placeholder="xóa number nhé">

    <button class="btn1">Click</button>
    <button class="btn2">Click2</button>
    <button class="btn3">click3</button>
    <button class="btn4">click4</button>
    <button class="btn5">click5</button>
    <button class="btn6">click6</button>
    <button class="btn7">click7</button>
    <button class="btn8">click8</button>


    <script>
        $(document).ready(function(){
            $(".btn1").click(function(){
                $("*").hide();
            })

            $(".btn2").click(function(){
                $(this).hide();
            })
            $(".btn3").click(function(){
                $("p.intro").hide();
            })
            $(".btn4").click(function(){
                $("p:first").hide();
            })
            $(".btn5").click(function(){
                $("ul li:first-child").hide();
            })
            $(".btn6").click(function(){
                $("[href]").hide();
            })
            $(".btn7").click(function(){
                $("input[type='text']").hide();
            })
            $(".btn8").click(function(){
                $("input[type='number']").hide();
            })
        })
    </script>
</body>
</html>
