<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <p id="p1">hover vào đây nhé</p>

    <script>
        $(document).ready(function(){
            $("#p1").hover(function(){
                alert("Bạn đã hover vào p1");
            },function(){
                alert("bạn ko hover vào p");
            });
        });
    </script>
</body> 
</html>
